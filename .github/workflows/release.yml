name: draft-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.1)
        required: true
        default: v0.1.1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_docs.py
      - run: python tools/package_release.py --out dist
      - name: Attach artifacts without replacing published files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*
          else
            gh release create "$RELEASE_TAG" dist/* --draft --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
